<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 496" width="1000" height="496" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0147ff"/><stop offset="1" stop-color="#0a7a36"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0147ff"/><stop offset="1" stop-color="#1dca5e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0147ff"/>
    </marker>
  </defs>
  <style>
    .panel { fill:#f5f5f7; stroke:#e0e0e0; stroke-width:1.5; }
    .panel-d { fill:#f5f5f7; stroke:#e0e0e0; stroke-width:1.5; stroke-dasharray:6 5; }
    .box   { fill:#ffffff; stroke:#e0e0e0; stroke-width:1.5; }
    .ptitle{ font-size:12px; font-weight:700; fill:#0147ff; letter-spacing:.05em; }
    .l     { font-size:13px; font-weight:700; fill:#1d1d1f; }
    .s     { font-size:11px; fill:#6e6e73; }
    .el    { font-size:10.5px; fill:#6e6e73; }
    .gl    { font-size:9.5px; fill:#6e6e73; text-anchor:middle; }
    .edge  { stroke:#0147ff; stroke-width:1.6; fill:none; opacity:.7; marker-end:url(#arrow); }
    .edge-d{ stroke:#0147ff; stroke-width:1.6; fill:none; opacity:.7; stroke-dasharray:5 4; marker-end:url(#arrow); }
    .wl    { font-size:13px; font-weight:700; fill:#ffffff; }
    .ws    { font-size:11.5px; fill:#ffffff; opacity:.9; }
  </style>

  <rect x="0" y="0" width="1000" height="496" rx="12" fill="#ffffff"/>

  <!-- CLIENT -->
  <rect class="panel" x="24" y="24" width="280" height="302" rx="18"/>
  <rect x="24" y="40" width="4" height="270" rx="2" fill="url(#brand)"/>
  <text class="ptitle" x="44" y="54">CLIENT · Next.js 16 / Vercel</text>
  <rect class="box" x="44" y="90" width="240" height="62" rx="11"/>
  <text class="l" x="62" y="116">방문객 QR 모바일 웹</text>
  <text class="s" x="62" y="135">AI 안내 · 지도 · 예약 · 쿠폰</text>
  <rect class="box" x="44" y="164" width="240" height="62" rx="11"/>
  <text class="l" x="62" y="190">운영자 콘솔</text>
  <text class="s" x="62" y="209">기준정보 · 티켓 · 현장 · ESG</text>
  <rect class="box" x="44" y="238" width="240" height="68" rx="11"/>
  <text class="l" x="62" y="264">참여업체 콘솔</text>
  <text class="s" x="62" y="283">부스 · 메뉴 · 쿠폰 · 성과</text>

  <!-- API -->
  <rect class="panel" x="360" y="24" width="280" height="302" rx="18"/>
  <rect x="360" y="40" width="4" height="270" rx="2" fill="url(#brand)"/>
  <text class="ptitle" x="380" y="54">API · FastAPI 3.12 / Railway</text>
  <rect class="box" x="380" y="90" width="240" height="62" rx="11"/>
  <text class="l" x="398" y="116">인증 · 권한</text>
  <text class="s" x="398" y="135">역할·축제 범위, 토큰 회전</text>
  <rect class="box" x="380" y="164" width="240" height="62" rx="11"/>
  <text class="l" x="398" y="190">도메인 서비스</text>
  <text class="s" x="398" y="209">콘텐츠 승인·게시, 예약, ESG</text>
  <rect class="box" x="380" y="238" width="240" height="68" rx="11"/>
  <text class="l" x="398" y="262">AI · 규칙 엔진</text>
  <text class="s" x="398" y="280">승인 콘텐츠 근거 검색, 민원 분류</text>
  <text class="s" x="398" y="296">운영 위험 브리프, 상권 추천</text>

  <!-- DATA -->
  <rect class="panel" x="696" y="24" width="280" height="302" rx="18"/>
  <rect x="696" y="40" width="4" height="270" rx="2" fill="url(#brand)"/>
  <text class="ptitle" x="716" y="54">DATA · PostgreSQL 16 / Railway</text>
  <rect class="box" x="716" y="90" width="240" height="62" rx="11"/>
  <text class="l" x="734" y="116">운영 데이터베이스</text>
  <text class="s" x="734" y="135">축제·프로그램·티켓·ESG·쿠폰</text>
  <rect class="box" x="716" y="164" width="240" height="62" rx="11"/>
  <text class="l" x="734" y="190">감사 로그</text>
  <text class="s" x="734" y="209">트리거로 수정·삭제 차단</text>
  <rect class="box" x="716" y="238" width="240" height="68" rx="11"/>
  <text class="l" x="734" y="262">인프로세스 잡 워커</text>
  <text class="s" x="734" y="280">보고서 스냅샷, 만료 정리</text>
  <text class="s" x="734" y="296">FOR UPDATE SKIP LOCKED</text>

  <!-- 연결 -->
  <path class="edge" d="M288 121 L370 121"/>
  <path class="edge" d="M288 195 L370 195"/>
  <path class="edge" d="M288 269 L370 269"/>
  <text class="gl" x="329" y="112">HTTPS·JSON</text>
  <path class="edge" d="M624 121 L706 121"/>
  <path class="edge" d="M624 195 L706 195"/>
  <path class="edge" d="M624 269 L706 269"/>
  <text class="gl" x="665" y="112">psycopg 3</text>
  <path class="edge-d" d="M500 316 L500 350"/>
  <text class="el" x="512" y="340">실패 시 규칙 기반 대체</text>

  <!-- 설계 원칙 -->
  <rect x="24" y="356" width="280" height="116" rx="18" fill="url(#ink)"/>
  <text class="wl" x="48" y="384">설계 원칙</text>
  <text class="ws" x="48" y="408">승인·게시된 콘텐츠만 공개</text>
  <text class="ws" x="48" y="428">작성자·최종 승인자 분리</text>
  <text class="ws" x="48" y="448">멱등성 키·버전 충돌 방지</text>
  <text class="ws" x="48" y="466">수정·삭제 불가 감사 로그</text>

  <!-- 외부 연동 -->
  <rect class="panel-d" x="360" y="356" width="616" height="116" rx="18"/>
  <rect x="360" y="372" width="4" height="84" rx="2" fill="url(#brand)"/>
  <text class="ptitle" x="380" y="384">EXTERNAL · 모두 선택 (없거나 실패해도 화면은 멈추지 않음)</text>
  <rect class="box" x="380" y="400" width="108" height="54" rx="11"/>
  <text class="l" x="396" y="424">Alan AI</text>
  <text class="s" x="396" y="441">요약 문장</text>
  <rect class="box" x="497" y="400" width="108" height="54" rx="11"/>
  <text class="l" x="513" y="424">Translate</text>
  <text class="s" x="513" y="441">en · zh · ja</text>
  <rect class="box" x="614" y="400" width="108" height="54" rx="11"/>
  <text class="l" x="630" y="424">CosyVoice 3</text>
  <text class="s" x="630" y="441">음성 합성</text>
  <rect class="box" x="731" y="400" width="108" height="54" rx="11"/>
  <text class="l" x="747" y="424">LiveAvatar</text>
  <text class="s" x="747" y="441">아바타</text>
  <rect class="box" x="848" y="400" width="108" height="54" rx="11"/>
  <text class="l" x="864" y="424">Kakao Map</text>
  <text class="s" x="864" y="441">지도 SDK</text>
</svg>
